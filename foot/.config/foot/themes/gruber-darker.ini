# Gruber Darker
# Ported from the kitty theme ~/.config/kitty/themes/gruber.conf
# (upstream: https://github.com/ring0-rootkit/gruber-darker-kitty)

[colors-dark]
background=181818
foreground=e4e4e4

cursor=000000 ffdd33

## Normal/regular colors (color palette 0-7)
regular0=101010  # black
regular1=f43841  # red
regular2=73d936  # green
regular3=ffdd33  # yellow
regular4=96a6c8  # blue
regular5=9e95c7  # magenta
regular6=95a99f  # cyan
regular7=e4e4e4  # white

## Bright colors (color palette 8-15)
bright0=453d41   # bright black
bright1=f43841   # bright red
bright2=73d936   # bright green
bright3=ffdd33   # bright yellow
bright4=96a6c8   # bright blue
bright5=9e95c7   # bright magenta
bright6=95a99f   # bright cyan
bright7=ffffff   # bright white

## Misc colors
selection-foreground=181818
selection-background=f5f5f5
urls=ff4f58
