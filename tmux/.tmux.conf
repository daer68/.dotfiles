# ~/.tmux.conf

# --- windows/panes start at 1, not 0 ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on   # keep numbering sequential when a window closes

# --- Gruber Darker palette, yellow accent ---
# bg    #181818
# fg    #e4e4ef
# black #1e1e1e
# grey  #99968b (comments/inactive)
# red   #f43841
# yellow (accent) #ffdd33

set -g status-style "bg=#181818,fg=#e4e4ef"

setw -g window-status-style "bg=#181818,fg=#99968b"
setw -g window-status-current-style "bg=#ffdd33,fg=#181818,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

set -g pane-border-style "fg=#99968b"
set -g pane-active-border-style "fg=#ffdd33"

set -g message-style "bg=#ffdd33,fg=#181818"
set -g message-command-style "bg=#181818,fg=#ffdd33"

set -g status-left "#[bg=#ffdd33,fg=#181818,bold] #S #[bg=#181818,fg=#e4e4ef,nobold] "
set -g status-right "#[fg=#99968b]%Y-%m-%d %H:%M "
set -g status-left-length 20

# --- general QoL (easy to remove if unwanted) ---
set -g mouse on
set -sg escape-time 0
set -g history-limit 10000
